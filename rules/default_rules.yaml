# HomeSIEM rules.
#
# Edit this file, then click "Reload rules" on the Rules page (no restart needed).
# If the file has a mistake, the old rules stay active and the Logs page tells you why.
#
#   enabled:           true / false
#   severity:          low | medium | high
#   cooldown_minutes:  after an alert, the same device or source stays quiet this long (0 = never quiet)
#   notify:            true = this rule may send a notification (see "notify" below)
#
# SECURITY: this file can contain passwords and tokens. Do not share it or commit it to Git.

notify:
  min_severity: high        # only alerts at this level or above are sent out
  telegram:
    bot_token: ""           # create a bot with @BotFather
    chat_id: ""             # your chat id, in quotes
  webhook:
    url: ""                 # Slack, Discord, Mattermost or similar incoming-webhook URL
  email:
    smtp_host: ""           # for example smtp.gmail.com (uses STARTTLS on port 587)
    smtp_port: 587
    username: ""
    password: ""            # use an app password, not your main password
    from: ""
    to: ""

rules:
  # Someone typed the dashboard password wrongly too many times and was locked out for 15 minutes.
  login_lockout:
    enabled: true
    severity: medium
    cooldown_minutes: 10
    notify: true

  # Alerts from log messages that routers and other machines send to HomeSIEM
  # (see the Logs page). The patterns themselves are listed in "log_rules" at the end.
  log_match:
    enabled: true
    severity: medium        # used when a log rule has no valid severity of its own
    cooldown_minutes: 0
    notify: true

  # A device that was not there at the first scan joins the network.
  new_device:
    enabled: true
    severity: medium
    cooldown_minutes: 0
    notify: true

  # A risky service is found open on a device.
  risky_port:
    enabled: true
    severity: high
    cooldown_minutes: 0
    notify: true
    ports: [21, 23, 513, 514, 2323, 3389, 5555, 5900, 7547, 37777]

  # Any other port opens on a device that was already scanned before.
  new_open_port:
    enabled: true
    severity: medium
    cooldown_minutes: 0
    notify: true

  # Port scan (one address probes many ports on one host) or network sweep
  # (one address tries one port on many hosts). Needs live capture.
  port_scan:
    enabled: true
    severity: high
    cooldown_minutes: 5
    notify: true
    window_seconds: 10
    port_threshold: 20      # distinct ports on one host within the window
    host_threshold: 30      # distinct hosts on one port within the window
    ignore_self: true       # HomeSIEM's own port scans are not an attack
    ignore_sources: []      # trusted scanners, e.g. ["192.168.1.50", "10.0.0.0/24"]

  # A device moves far more data in a minute than it normally does. Needs capture.
  bandwidth_spike:
    enabled: true
    severity: medium
    cooldown_minutes: 15
    notify: false
    min_mb_per_minute: 50   # never alert below this, however unusual
    factor: 5               # alert above this many times the device's usual rate
    warmup_minutes: 10      # minutes of learning before alerts start

  # A device connects to an outside address and port it has never used before.
  # Needs capture. Ordinary web, DNS and time traffic is ignored because
  # websites change addresses constantly.
  new_destination:
    enabled: true
    severity: medium
    cooldown_minutes: 10
    notify: false
    learning_hours: 24      # a device is watched silently for this long first
    ignore_ports: [53, 80, 123, 443]
    strict_devices: []      # names, vendors, IPs or MACs where EVERY new destination counts, e.g. ["camera"]

  # Two different devices claim the same IP address (a sign of ARP spoofing). Needs capture.
  arp_spoofing:
    enabled: true
    severity: high
    cooldown_minutes: 10
    notify: true
    conflict_seconds: 60

# Patterns that turn received log messages into alerts. Add your own.
#   name:            shown on the Alerts page as "log:<name>"
#   match:           words or a regular expression, not case sensitive; use | for "or"
#   severity:        low | medium | high
#   threshold:       how many matching messages are needed (1 = every match alerts) ...
#   within_seconds:  ... inside this time
#   group_by:        ip   = count separately per address found in the message (for example the attacker)
#                    host = count separately per machine that sent the log
#   cooldown_minutes: stay quiet this long after an alert for the same group
log_rules:
  - name: login_failures
    match: "failed password|authentication failure|invalid user|login failed|incorrect password|bad password"
    severity: high
    threshold: 5
    within_seconds: 120
    group_by: ip
    cooldown_minutes: 10

  - name: system_trouble
    match: "kernel panic|segfault|out of memory|oom-killer|i/o error"
    severity: medium
    threshold: 1
    within_seconds: 60
    group_by: host
    cooldown_minutes: 30
